# Cloudflare Worker + Static Assets. Serves the game from dist/ and runs
# worker/index.ts only for /api/* (optional AI flavor text).
# Secrets: OPENROUTER_API_KEY (optional fallback) via the dashboard or
# `wrangler secret put OPENROUTER_API_KEY`.
name = "modern-american-trail"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Workers AI: free plan includes a daily allocation and stops there; no billing.
[ai]
binding = "AI"

[vars]
OPENROUTER_MODELS = "apodex/apodex-1.1-mini:free,inception/mercury-decide:free"

[observability]
enabled = true
